name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all problem records
        run: |
          python3 tools/validate.py "collections/*/*/problems/*.json"
      - name: Run test suite
        run: |
          python3 tests/run_tests.py
      - name: Check Pages data in sync
        run: |
          python3 tools/build_web.py --check
