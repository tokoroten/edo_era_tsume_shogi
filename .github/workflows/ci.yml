name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all problem records
        run: |
          python3 tools/validate.py "collections/*/*/problems/*.json"
      - name: Validate all collection records
        run: |
          python3 tools/validate.py "collections/*/*/collection.json"
      - name: Validate staging drafts
        run: |
          python3 tools/validate.py --draft
      - name: Validate procedure transcriptions
        run: |
          python3 tools/validate.py --procedures
      - name: Run test suite
        run: |
          python3 tests/run_tests.py
      - name: Check Pages data in sync
        run: |
          python3 tools/build_web.py --check
      - name: Check drafts page in sync
        run: |
          python3 tools/build_drafts_page.py
          git diff --exit-code -- web/drafts.html web/collections
      - name: Check procedures page in sync
        run: |
          python3 tools/build_procedures_page.py --check
